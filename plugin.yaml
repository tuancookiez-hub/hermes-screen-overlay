name: screen-overlay
version: 0.3.2
manifest_version: 2
description: >-
  Gives Hermes the ability to draw on your screen. On your real Windows desktop it draws a gliding
  pointer, spotlights, boxes, arrows and numbered steps anchored to live UI Automation elements, a
  floating step guide, and handwritten glass notes, including ones that stay for you to drag and
  edit. Never takes focus unless you choose to edit a note, DPI- and multi-monitor-aware, with an emergency clear
  hotkey (Ctrl+Alt+Shift+F12).
author: tuancookiez
license: MIT
requires_hermes: ">=0.22.0"
tags:
  - windows
  - desktop
  - overlay
  - teach
provides_tools:
  - screen_overlay
provides_hooks:
  - on_session_finalize
requires_env: []
config_schema:
  exclude_from_capture:
    type: bool
    default: true
    label: Hide overlay from screenshots
    description: >-
      Keeps the overlay out of screenshots and screen recordings (including Hermes' own), so the
      agent never mistakes its marks for app UI. Turn off to record demos.
  default_ttl_seconds:
    type: int
    default: 300
    label: Auto-clear after (seconds)
    description: Marks disappear after this long unless the call sets ttl_seconds. 0 keeps them until cleared.
  idle_exit_minutes:
    type: int
    default: 10
    label: Stop the overlay process after idle minutes
    description: The background overlay process exits when nothing has been on screen for this long (minimum 1).
